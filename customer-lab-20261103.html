  function renderImports(){const el=$('v-import-list');el.replaceChildren();for(const [i,r] of importRows.entries()){const label=document.createElement('label');label.className='import-row';label.innerHTML=`<input type="checkbox" data-index="${i}" ${r.already?'data-already="true" disabled':'checked'}><span class="name"><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.phone||'전화번호 없음')}</span></span>${r.already?'<span class="badge">이미 등록됨</span>':''}`;label.querySelector('input').onchange=chosenCount;el.appendChild(label);}const fresh=importRows.filter(r=>!r.already).length;$('v-import-count').textContent='찾은 고객 '+importRows.length+'명 · 새로 등록할 수 있는 고객 '+fresh+'명';$('v-select-all').checked=fresh>0;$('v-import-results').hidden=false;$('v-import-intro').hidden=true;if(!importRows.length)el.innerHTML='<p>이름에 /장고/ 또는 /자고/가 있는 연락처가 없어요.</p>';chosenCount();}
  function startPhoto(r){if(!discard())return;draft=r?{...r}:null;dirty=false;releasePhoto();$('v-file').value='';$('v-photo-title').textContent=r?r.name+' · 사진으로 정보 보충':'고객 화면 사진을 넣어주세요';tell('');navigate('photo');}
  function showReview(file,fields){const old=draft||{};for(const f of C.fields){const value=fields[f]||old[f]||'';$('vf-'+f).value=value;const changed=!!(fields[f]&&fields[f]!==old[f]);$('vf-'+f).classList.toggle('changed',changed);const before=$('vp-'+f);before.hidden=!(changed&&old[f]);before.textContent='기존: '+(old[f]||'');}if(file){releasePhoto();photoURL=URL.createObjectURL(file);$('v-preview').src=photoURL;$('v-preview').hidden=false;$('v-no-preview').hidden=true;}else{$('v-no-preview').hidden=!!photoURL;}$('v-review-help').textContent=file?'사진에서 읽은 값은 노란색이에요. 이름·번호·주소를 반드시 비교해 주세요.':'내용을 확인하고 저장해 주세요.';dirty=true;tell('');navigate('review');}
  async function readPhoto(file){if(!file)return;tell('사진을 읽고 있어요…');const result=await MWCustomerOCR.read(file,text=>tell(text));showReview(file,result.fields);if(!result.found)tell('사진에서 항목을 찾지 못했어요. 원본을 보며 직접 입력하거나 더 선명한 사진을 넣어 주세요.',true);else tell('사진에서 '+result.found+'개 항목을 읽었어요. 틀린 곳이 없는지 확인해 주세요.');}
  async function save(){const data=C.normalize(Object.fromEntries(C.fields.map(f=>[f,$('vf-'+f).value])));await load();let previous=draft?.id?records.find(r=>r.id===draft.id):null;if(!previous){const same=C.existing(data,records);if(same){draft={...same};showReview(null,data);tell('이미 저장한 고객을 찾았어요. 변경된 내용을 확인하고 저장을 다시 눌러 주세요.');return;}}
    const base=previous||{};const chosen=C.fields.filter(f=>!!data[f]);const record=C.validateRecord({...base,...C.merge(base,data,chosen),id:base.id||id(),updatedAt:now(),contact:base.contact||null});const next=records.filter(r=>r.id!==record.id).concat(record);await persist(next);records=next;selected=record.id;dirty=false;draft=null;releasePhoto();$('v-search').value='';navigate('home');list();detail();tell('고객정보를 저장했어요.');}
  $('v-search-form').onsubmit=e=>{e.preventDefault();run(async()=>{await load();list();const found=D.search(records,$('v-search').value);selected=found[0]?.id||null;detail();});};$('v-search').oninput=()=>{if(loaded){list();}};
  $('v-add').onclick=()=>startPhoto(null);$('v-pick').onclick=()=>$('v-file').click();$('v-file').onchange=()=>run(()=>readPhoto($('v-file').files[0]));
  $('v-drop').ondragover=e=>{e.preventDefault();$('v-drop').classList.add('over');};$('v-drop').ondragleave=()=>$('v-drop').classList.remove('over');$('v-drop').ondrop=e=>{e.preventDefault();$('v-drop').classList.remove('over');if(!busy)run(()=>readPhoto(e.dataTransfer.files[0]));};
  document.addEventListener('paste',e=>{if(view!=='photo'||busy)return;const file=[...(e.clipboardData?.items||[])].find(x=>x.type.startsWith('image/'))?.getAsFile();if(file){e.preventDefault();run(()=>readPhoto(file));}});
  $('v-manual').onclick=()=>showReview(null,{});$('v-save').onclick=()=>run(save);$('v-rephoto').onclick=()=>{if(discard()){dirty=false;releasePhoto();navigate('photo');}};
  for(const key of ['v-photo-back','v-review-back','v-import-back'])$(key).onclick=()=>{if(discard()){dirty=false;draft=null;releasePhoto();tell('');navigate('home');list();detail();}};
  $('v-import').onclick=()=>{if(!discard())return;dirty=false;releasePhoto();tell('');$('v-import-intro').hidden=false;$('v-import-results').hidden=true;navigate('import-page');};
  $('v-import-start').onclick=()=>run(async()=>{if(!demo&&typeof ensureCustomerSetup==='function')await ensureCustomerSetup();await load();tell('주소록에서 고객을 찾고 있어요…');const people=await allPeople();contacts=C.contacts(people);importRows=D.candidates(people,records);renderImports();tell('명단을 확인하고 등록할 고객을 선택해 주세요. 아직 저장하지 않았어요.');});
  $('v-select-all').onchange=()=>{root.querySelectorAll('#v-import-list input:not([data-already])').forEach(e=>e.checked=$('v-select-all').checked);chosenCount();};
  $('v-import-save').onclick=()=>run(async()=>{const chosen=[...root.querySelectorAll('#v-import-list input:checked:not([data-already])')].map(e=>importRows[Number(e.dataset.index)]);if(!chosen.length)throw Error('등록할 고객을 선택해 주세요.');const next=D.mergeImport(records,chosen,id,now());const validated=next.map(C.validateRecord);await persist(validated);const added=validated.length-records.length;records=validated;selected=chosen.length?records.find(r=>r.contact?.id===chosen[0].contact.id)?.id:null;$('v-search').value='';navigate('home');list();detail();tell(added+'명의 고객을 등록했어요. 주소록 원본은 바꾸지 않았어요.');});
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  if(demo){loaded=true;$('v-cloud-status').textContent='연습 모드 · 실제 구글 자료를 읽거나 저장하지 않아요';$('v-demo-link').textContent='실제 화면으로';$('v-demo-link').href=location.pathname;tell('연습용 화면이에요. 오른쪽 위 주소록 가져오기로 가상 고객 2명을 등록해 보세요.');}
  list();detail();
})();

</script></body></html>
