  const anchor=$('sales-btn');if(anchor)anchor.before(button);else document.body.appendChild(button);
  function message(text,error=false){$('mwc-message').textContent=text;$('mwc-message').classList.toggle('mw-error',error);}
  async function run(fn){if(busy)return;busy=true;dialog.querySelectorAll('button,input,textarea').forEach(b=>b.disabled=true);try{await fn();}catch(e){message(e.message||'처리하지 못했어요. 다시 확인해 주세요.',true);}finally{busy=false;dialog.querySelectorAll('button,input,textarea').forEach(b=>b.disabled=false);}}
  function form(){return C.normalize(Object.fromEntries(C.fields.map(f=>[f,$('mwc-f-'+f).value])));}
  function fill(data){for(const f of C.fields)$('mwc-f-'+f).value=data[f]||'';$('mwc-confirm').checked=false;}
  function markDirty(){dirty=true;$('mwc-confirm').checked=false;}
  function canDiscard(){return !dirty||window.confirm('아직 저장하지 않은 내용이 있어요. 저장하지 않고 다른 고객을 볼까요?');}
  function clearDraft(){editingId=null;selectedContact=null;fill({});$('mwc-import').value='';$('mwc-contact-q').value='';$('mwc-customer-file').value='';$('mwc-file-name').textContent='';$('mwc-diff-wrap').hidden=true;$('mwc-candidates').replaceChildren();$('mwc-linked').textContent='주소록 연결 없이도 저장할 수 있어요';dirty=false;clearPreview();}
  function clearPreview(){if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;$('mwc-preview').hidden=true;$('mwc-preview').removeAttribute('src');$('mwc-image').value='';}
  function renderList(){const list=$('mwc-list');list.replaceChildren();const found=C.search(records,$('mwc-search').value);if(!found.length){const e=document.createElement('div');e.className='mw-empty';e.textContent='저장한 고객이 없거나 검색 결과가 없어요.';list.appendChild(e);return;}for(const r of found){const b=document.createElement('button');b.className='mw-record'+(r.id===editingId?' mw-selected':'');b.innerHTML=`<strong>${safe(r.name)}</strong><span>${safe(r.phone||r.homePhone||'전화번호 없음')}</span><div class="mw-sub">${safe(r.contact?.name||'주소록 미연결')}</div>`;b.onclick=()=>{if(canDiscard())openRecord(r);};list.appendChild(b);}}
  function openRecord(r){clearDraft();editingId=r.id;selectedContact=r.contact;fill(r);showLinked();renderList();message('저장된 고객정보를 열었어요. 변경 후 확인하면 새 기록으로 저장돼요.');}
  function showLinked(){$('mwc-linked').textContent=selectedContact?'연결할 연락처: '+selectedContact.name+' · 저장하면 이 연결을 기억해요.':'연결한 연락처 없음';}
  function renderCandidates(){const data=form();const candidates=C.matches(data,contactList,$('mwc-contact-q').value);const el=$('mwc-candidates');el.replaceChildren();if(!candidates.length){el.textContent=contactList.length?'일치 후보가 없어요. 주소록에 저장한 이름이나 전화번호로 찾아보세요.':'구글 주소록을 먼저 불러와 주세요.';return;}for(const c of candidates.slice(0,50)){const b=document.createElement('button');b.className='mw-record';b.innerHTML=`<strong>${safe(c.name)} ${c.exact?'· 번호 일치':''}</strong><span>${safe(c.phones.join(' / ')||'번호 없음')}</span>`;b.onclick=()=>{selectedContact={id:c.id,name:c.name};showLinked();markDirty();};el.appendChild(b);}}
  function updateDiff(){const previous=records.find(r=>r.id===editingId);const box=$('mwc-diffs');box.replaceChildren();$('mwc-diff-wrap').hidden=!previous;if(!previous)return;const next=form();for(const d of C.changes(previous,next)){const label=document.createElement('label');label.className='mw-diff';label.innerHTML=`<input type="checkbox" checked data-field="${d.field}"> ${safe(C.labels[d.field])}<div>기존: ${safe(d.before||'(없음)')}</div><div>새 값: ${safe(d.after)}</div>`;box.appendChild(label);}if(!box.children.length)box.textContent='변경할 항목이 없어요. 빈 항목으로 기존 값을 지우지 않아요.';}
  function importData(){const data=C.parse($('mwc-import').value);if(!editingId){const found=C.existing(data,records);if(found){editingId=found.id;selectedContact=found.contact;showLinked();}}const previous=records.find(r=>r.id===editingId);fill(previous?{...previous,...Object.fromEntries(Object.entries(data).filter(([,v])=>v))}:data);markDirty();updateDiff();message(previous?'이미 저장한 고객이에요. 바뀐 내용만 확인한 뒤 저장해 주세요.':'고객정보를 채웠어요. 내용이 맞으면 확인란을 체크하고 저장해 주세요.');if(contactList.length)renderCandidates();renderList();}
  async function getContacts(){if(demo){renderCandidates();return;}if(typeof peopleApiFetch!=='function')throw Error('기존 구글 주소록 연결 기능을 찾지 못했어요.');let all=[],page='';for(let i=0;i<100;i++){const u='https://people.googleapis.com/v1/people/me/connections?personFields=names,phoneNumbers&pageSize=1000'+(page?'&pageToken='+encodeURIComponent(page):'');const data=await peopleApiFetch(u);all.push(...(data.connections||[]));page=data.nextPageToken||'';if(!page)break;}if(page)throw Error('주소록이 너무 많아 전부 불러오지 못했어요.');contactList=C.contacts(all);renderCandidates();message('주소록을 불러왔어요. 이름이 달라도 전화번호가 같은 후보를 표시해요.');}
  async function token(){if(typeof ensureDriveToken!=='function')throw Error('기존 구글드라이브 연결 기능을 찾지 못했어요.');return ensureDriveToken();}
  async function request(url,t,options={}){const response=await fetch(url,{...options,headers:{Authorization:'Bearer '+t,...options.headers}});if(!response.ok)throw Error(response.status===401?'구글 연결이 만료됐어요. 다시 연결해 주세요.':'구글드라이브 요청 실패 ('+response.status+')');return response;}
  async function latest(t){const q="trashed=false and appProperties has { key='mwCustomerTest' and value='v1' }";const u='https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q,pageSize:'1',orderBy:'createdTime desc',fields:'files(id,name,createdTime)'});const data=await(await request(u,t)).json();return data.files?.[0]||null;}
  async function readCloud(){const t=await token();const file=await latest(t);let next=[];if(file){const doc=await(await request('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(file.id)+'?alt=media',t)).json();if(doc.schema!==1||!Array.isArray(doc.customers)||doc.customers.length>20000)throw Error('저장 파일 형식이 올바르지 않아요.');next=doc.customers.map(C.validateRecord);if(new Set(next.map(r=>r.id)).size!==next.length)throw Error('중복 고객 ID가 있어 불러오기를 중단했어요.');}return {customers:next,fileId:file?.id||null};}
  async function loadCloud(){if(!canDiscard())return;if(demo&&records.length&&!window.confirm('가상 체험을 끝내고 실제 드라이브의 테스트 자료를 불러올까요?'))return;const state=await readCloud();records=state.customers;remoteBase=state.fileId;loaded=true;demo=false;contactList=[];clearDraft();renderList();$('mwc-storage').textContent='저장한 고객 · '+records.length+'명';message('고객정보를 불러왔어요. 이름이나 전화번호로 찾아보세요.');}
  async function persist(next){const t=await token();const current=await latest(t);if((current?.id||null)!==remoteBase)throw Error('다른 기기에서 저장한 새 자료가 있어요. 입력한 내용을 복사해 둔 뒤 드라이브를 다시 불러와 주세요.');const meta={name:DNAME+'_'+stamp().replace(/[:.]/g,'-')+'.json',mimeType:'application/json',appProperties:{mwCustomerTest:'v1'}};const boundary='mw_customer_'+uid().replace(/-/g,'');const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({schema:1,savedAt:stamp(),previousFileId:remoteBase,customers:next})+'\r\n--'+boundary+'--';if(new Blob([body]).size>4500000)throw Error('고객 데이터가 커서 이번 테스트 버전에서는 저장할 수 없어요.');const data=await(await request('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',t,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body})).json();if(!data.id)throw Error('저장 결과를 확인하지 못했어요. 드라이브를 다시 불러와 주세요.');remoteBase=data.id;}
  async function save(){if(!$('mwc-confirm').checked)throw Error('원본과 비교한 뒤 확인란을 체크해 주세요.');const data=form();if(!loaded&&!demo){const state=await readCloud();records=state.customers;remoteBase=state.fileId;loaded=true;const existing=C.existing(data,records);if(existing){editingId=existing.id;selectedContact=selectedContact||existing.contact;fill({...existing,...Object.fromEntries(Object.entries(data).filter(([,v])=>v))});showLinked();markDirty();updateDiff();renderList();message('이미 저장한 고객을 찾았어요. 바뀐 내용을 한 번 확인하고 저장해 주세요.');return;}}const previous=records.find(r=>r.id===editingId);let nextData=data;
    if(previous){const changed=C.changes(previous,data);const checks=[...$('mwc-diffs').querySelectorAll('input[data-field]')];const selected=checks.length?checks.filter(e=>e.checked).map(e=>e.dataset.field):changed.map(d=>d.field);nextData=C.merge(previous,data,selected);}
    if(!previous){const same=records.filter(r=>selectedContact&&r.contact?.id===selectedContact.id||[data.phone,data.homePhone].map(C.normPhone).filter(n=>n.length>=9).some(n=>[r.phone,r.homePhone].map(C.normPhone).includes(n)));if(same.length)throw Error('같은 연락처 또는 번호의 고객이 이미 있어요. 왼쪽에서 기존 고객을 열고 답변을 가져와 주세요.');}
    const record=C.validateRecord({...nextData,id:editingId||uid(),updatedAt:stamp(),contact:selectedContact});const next=records.filter(r=>r.id!==record.id).concat(record);if(!demo)await persist(next);records=next;editingId=record.id;dirty=false;fill(record);$('mwc-diff-wrap').hidden=true;renderList();$('mwc-storage').textContent=(demo?'가상 체험 · 브라우저를 닫으면 사라져요':'드라이브 저장 완료')+' · '+records.length+'명';message(demo?'가상 고객을 저장했어요. 실제 드라이브·주소록에는 쓰지 않았어요.':'구글드라이브에 새 테스트 파일로 저장했어요. 이전 파일과 주소록은 그대로예요.');}
  $('mwc-close').onclick=()=>{if(canDiscard()){clearDraft();dialog.close();}};
  dialog.addEventListener('cancel',e=>{if(!canDiscard())e.preventDefault();else clearDraft();});
  $('mwc-new').onclick=()=>{if(canDiscard()){clearDraft();renderList();message('위의 받은 고객정보 파일 선택 버튼을 눌러 주세요.');}};
  $('mwc-choose-file').onclick=()=>$('mwc-customer-file').click();
  $('mwc-customer-file').onchange=()=>run(async()=>{const file=$('mwc-customer-file').files[0];if(!file)return;if(file.size>100000)throw Error('고객 한 명의 고객정보 파일을 선택해 주세요.');const text=await file.text();C.parse(text);if(!canDiscard())return;clearDraft();$('mwc-import').value=text;importData();$('mwc-file-name').textContent='가져온 파일: '+file.name;if(!demo&&!contactList.length&&typeof gcontactSignedIn==='function'&&gcontactSignedIn()){try{await getContacts();}catch{message('정보를 가져왔어요. 주소록 연결은 나중에 다시 할 수 있어요.');}}});
  $('mwc-search').oninput=renderList;
  $('mwc-parse').onclick=()=>run(importData);
  $('mwc-contacts').onclick=()=>run(getContacts);
  $('mwc-match').onclick=()=>run(renderCandidates);
  $('mwc-contact-q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();run(renderCandidates);}};
  $('mwc-unlink').onclick=()=>{selectedContact=null;showLinked();markDirty();};
  $('mwc-load').onclick=()=>run(loadCloud);
  $('mwc-save').onclick=()=>run(save);
  $('mwc-import').oninput=markDirty;
  C.fields.forEach(f=>$('mwc-f-'+f).addEventListener('input',()=>{markDirty();try{updateDiff();}catch{}}));
  $('mwc-diffs').addEventListener('change',markDirty);
  $('mwc-image').onchange=()=>{const file=$('mwc-image').files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>15000000){message('15MB 이하 PNG·JPG·WebP 이미지를 선택해 주세요.',true);return;}if(previewURL)URL.revokeObjectURL(previewURL);previewURL=URL.createObjectURL(file);$('mwc-preview').src=previewURL;$('mwc-preview').hidden=false;};
  $('mwc-prompt').onclick=()=>run(async()=>{try{await navigator.clipboard.writeText(C.prompt);message('요청문을 복사했어요. 제미나이에 이미지와 함께 붙여넣어 주세요.');}catch{const area=$('mwc-import');area.value=C.prompt;area.focus();area.select();message('자동 복사가 안 되어 요청문을 선택했어요. Ctrl+C로 복사해 주세요.');}});
  $('mwc-demo').onclick=()=>{if(!canDiscard())return;demo=true;loaded=false;remoteBase=null;records=[];clearDraft();contactList=[{id:'people/demo_1',name:'예시고객님 자동차보험',phones:['02-000-0000','+82 10-0000-1234']},{id:'people/demo_2',name:'동명이인 예시',phones:['010-0000-9999']}];$('mwc-import').value=JSON.stringify(sample,null,2);importData();$('mwc-storage').textContent='가상 체험 · 실제 구글 데이터 사용 안 함';renderList();message('가상 고객 자료를 채웠어요. 번호가 같은 주소록 후보를 선택하고 저장해 보세요.');};
  window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
  renderList();
})();

document.getElementById('customer-info-btn').click();</script></body></html>
